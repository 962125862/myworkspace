services:
  # WebRTC / RTSP gateway.
  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: host
    environment:
      # IMPORTANT: set this to the public IP or DNS of the server so ICE candidates are reachable.
      # Example:
      #   PUBLIC_HOST=1.2.3.4 docker compose up -d
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST:-}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    restart: unless-stopped

  # Pull H264 (AnnexB) from strem_agent_server video port and publish it to MediaMTX (RTSP).
  republisher:
    build:
      context: ./republisher
      # Allow build stage to reach a proxy bound to 127.0.0.1 on the host.
      # (Build containers normally have their own network namespace.)
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        # If you're in CN and don't want to rely on proxy, you can set:
        #   APT_MIRROR=mirrors.tuna.tsinghua.edu.cn
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    network_mode: host
    environment:
      AGENT_HOST: ${AGENT_HOST:-127.0.0.1}
      AGENT_VIDEO_PORT: ${AGENT_VIDEO_PORT:-31234}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      STREAM_ID: ${STREAM_ID:-1}
      # Publish to this RTSP URL on the same host (mediamtx uses 8554 by default).
      MTX_RTSP_URL: ${MTX_RTSP_URL:-rtsp://127.0.0.1:34568/mystream}
    restart: unless-stopped
    depends_on:
      - mediamtx

  # WebSocket -> strem_agent_server ctrl TCP bridge.
  ws_ctrl_bridge:
    build:
      context: ./ws_ctrl_bridge
      # Allow build stage to reach a proxy bound to 127.0.0.1 on the host.
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    network_mode: host
    volumes:
      # Optional: allow ws_ctrl_bridge to start/stop containers (on-demand mode) via Docker Engine API.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LISTEN_PORT: ${CTRL_WS_PORT:-34567}
      AGENT_HOST: ${AGENT_HOST:-127.0.0.1}
      AGENT_CTRL_PORT: ${AGENT_CTRL_PORT:-31235}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      STREAM_NAME: ${STREAM_NAME:-mystream}
      MTX_HTTP_PORT: ${MTX_HTTP_PORT:-34569}
      CTRL_REF_W: ${CTRL_REF_W:-0}
      CTRL_REF_H: ${CTRL_REF_H:-0}
      # Improve late-join when upstream encoder has a long GOP / rarely sends IDR.
      # - Burst: send N REQ_IDR on viewer connect, spaced by interval (ms).
      # - Periodic: optional safety net (sec). Set 0 to disable.
      REQ_IDR_ON_CONNECT_BURST: ${REQ_IDR_ON_CONNECT_BURST:-3}
      REQ_IDR_BURST_INTERVAL_MS: ${REQ_IDR_BURST_INTERVAL_MS:-500}
      REQ_IDR_PERIOD_SEC: ${REQ_IDR_PERIOD_SEC:-0}
      # macOS: map Command-based shortcuts to CTRL on the Windows host.
      MAP_MAC_META_TO_CTRL: ${MAP_MAC_META_TO_CTRL:-1}
      # Optional: token gate + single-session + on-demand start/stop.
      TOKEN_REQUIRED: ${TOKEN_REQUIRED:-0}
      TOKEN_TTL_SEC: ${TOKEN_TTL_SEC:-300}
      TOKEN_ISSUE_SECRET: ${TOKEN_ISSUE_SECRET:-}
      TOKEN_WEBHOOK_URL: ${TOKEN_WEBHOOK_URL:-}
      TOKEN_WEBHOOK_AUTH: ${TOKEN_WEBHOOK_AUTH:-}
      TOKEN_WEBHOOK_DEBUG: ${TOKEN_WEBHOOK_DEBUG:-0}
      TOKEN_WEBHOOK_FORMAT: ${TOKEN_WEBHOOK_FORMAT:-raw}
      TOKEN_WEBHOOK_DING_TYPE: ${TOKEN_WEBHOOK_DING_TYPE:-common}
      TOKEN_WEBHOOK_DING_FLUSHNOW: ${TOKEN_WEBHOOK_DING_FLUSHNOW:-1}
      TOKEN_WEBHOOK_RETRY_MIN_SEC: ${TOKEN_WEBHOOK_RETRY_MIN_SEC:-5}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      SINGLE_SESSION: ${SINGLE_SESSION:-0}
      TOKEN_ISSUE_ON_WS_CONNECT: ${TOKEN_ISSUE_ON_WS_CONNECT:-0}
      TOKEN_SINGLE_USE: ${TOKEN_SINGLE_USE:-0}
      TOKEN_PER_IP_WINDOW_SEC: ${TOKEN_PER_IP_WINDOW_SEC:-300}
      ONDEMAND_ENABLE: ${ONDEMAND_ENABLE:-0}
      ONDEMAND_CONTAINERS: ${ONDEMAND_CONTAINERS:-}
      ONDEMAND_IDLE_TIMEOUT_SEC: ${ONDEMAND_IDLE_TIMEOUT_SEC:-60}
      BAD_TOKEN_WINDOW_SEC: ${BAD_TOKEN_WINDOW_SEC:-60}
      BAD_TOKEN_MAX: ${BAD_TOKEN_MAX:-10}
      BAN_SEC: ${BAN_SEC:-600}
    restart: unless-stopped
    depends_on:
      - mediamtx
