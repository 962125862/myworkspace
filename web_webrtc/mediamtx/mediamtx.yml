# MediaMTX configuration for a single published path.
# We rely on defaults for most settings.
#
# Ports (host network mode):
# - RTSP: 8554/tcp
# - WebRTC HTTP/WHEP pages: 8889/tcp
# - WebRTC ICE: 8189/udp (and 8189/tcp fallback)
#
# IMPORTANT:
# - Set env MTX_WEBRTCADDITIONALHOSTS (via PUBLIC_HOST in docker-compose) to your public IP/DNS.

logLevel: info

# Use only RTSP/TCP to avoid opening RTP/RTCP UDP ports.
rtspTransports: [tcp]

# Custom ports (MVP defaults):
# - RTSP: 34568/tcp
# - WebRTC HTTP: 34569/tcp
# - WebRTC ICE: 34570/udp (and optional 34570/tcp if enabled)
rtspAddress: :34568
webrtcAddress: :34569
webrtcLocalUDPAddress: :34570
webrtcLocalTCPAddress: :34570

paths:
  mystream:
    source: publisher
