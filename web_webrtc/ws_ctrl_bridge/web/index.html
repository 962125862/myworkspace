<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRTC Remote (MVP)</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #10151b;
        --text: #e9eef5;
        --muted: #96a2b3;
        --accent: #39d98a;
        --danger: #ff5c7a;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }
      .wrap {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent);
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      header .title {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      header .pill {
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--muted);
      }
      header .pill.ok {
        border-color: rgba(57, 217, 138, 0.35);
        color: rgba(57, 217, 138, 0.95);
      }
      header .pill.bad {
        border-color: rgba(255, 92, 122, 0.35);
        color: rgba(255, 92, 122, 0.95);
      }
      header .spacer {
        flex: 1;
      }
      header button {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 6px 10px;
        border-radius: 10px;
        cursor: pointer;
      }
      header button:hover {
        border-color: rgba(255, 255, 255, 0.28);
      }
      main {
        position: relative;
        overflow: hidden;
      }
      .stage {
        position: absolute;
        inset: 12px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.10);
        overflow: hidden;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: none;
      }
      /* Overlay captures input, but doesn't need to access the iframe content (different port origin). */
      .overlay {
        position: absolute;
        inset: 0;
        cursor: crosshair;
      }
      .hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 8px 10px;
        backdrop-filter: blur(6px);
        max-width: 70ch;
        display: none; /* default hidden; toggle via ?hint=1 */
      }
      .stage.hint-on .hint {
        display: block;
      }
      .hint code {
        color: rgba(57, 217, 138, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="title">Web Remote (MVP)</div>
        <div id="wsState" class="pill bad">ctrl: disconnected</div>
        <div class="pill">mouse: absolute</div>
        <div class="spacer"></div>
        <input id="token" placeholder="token" style="width: 220px" />
        <button id="btnConn" title="Connect control websocket">CONNECT</button>
        <button id="btnIdr" title="Request IDR (keyframe)">REQ_IDR</button>
      </header>
      <main>
		        <div class="stage" id="stage">
		          <iframe id="player" referrerpolicy="no-referrer"></iframe>
		          <video id="player2" playsinline muted autoplay></video>
			          <div class="overlay" id="overlay" tabindex="0"></div>
			          <div class="hint">
			            Video is served by MediaMTX at <code id="vurl"></code>.<br />
			            Input is sent over WS to <code id="wurl"></code>.<br />
            Tip: click inside the video area first, then use keyboard.
          </div>
        </div>
      </main>
    </div>
    <script>
      async function loadConfig() {
        try {
          const r = await fetch("/config.json", { cache: "no-store" });
          return await r.json();
        } catch (e) {
          return { streamName: "mystream", mtxHttpPort: 8889 };
        }
      }

      const host = window.location.hostname;
      const ctrlWsUrl = `ws://${window.location.host}/ws`;
      const params = new URLSearchParams(location.search);
      const playerMode = (params.get("player") || "whep").toLowerCase(); // whep | iframe
      const streamOverride = params.get("stream") || "";

      const iframe = document.getElementById("player");
      const video = document.getElementById("player2");
      let playerCfg = null;
      let pc = null;
      let videoStarting = false;

      function useIframe(playerUrl) {
        iframe.style.display = "block";
        video.style.display = "none";
        iframe.src = playerUrl;
      }

      async function startWhep(streamName) {
        iframe.style.display = "none";
        video.style.display = "block";
        video.srcObject = null;

        if (pc) {
          try {
            pc.close();
          } catch (_) {}
          pc = null;
        }

        pc = new RTCPeerConnection({
          bundlePolicy: "max-bundle",
          rtcpMuxPolicy: "require"
        });

        pc.addEventListener("track", (ev) => {
          if (ev.track.kind !== "video") return;
          video.srcObject = new MediaStream([ev.track]);
          video.play().catch(() => null);
        });

        pc.addTransceiver("video", { direction: "recvonly" });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise((resolve) => {
          if (pc.iceGatheringState === "complete") return resolve();
          const onChange = () => {
            if (pc.iceGatheringState === "complete") {
              pc.removeEventListener("icegatheringstatechange", onChange);
              resolve();
            }
          };
          pc.addEventListener("icegatheringstatechange", onChange);
        });

        const r = await fetch(`/whep?stream=${encodeURIComponent(streamName)}`, {
          method: "POST",
          headers: { "content-type": "application/sdp" },
          body: pc.localDescription.sdp
        });
        if (!r.ok) throw new Error(`whep failed: ${r.status}`);
        const answerSdp = await r.text();
        await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

        for (const t of pc.getTransceivers()) {
          if (t.receiver && "playoutDelayHint" in t.receiver) {
            try {
              t.receiver.playoutDelayHint = 0;
            } catch (_) {}
          }
        }

        window.addEventListener(
          "beforeunload",
          () => {
            try {
              pc.close();
            } catch (_) {}
          },
          { once: true }
        );
      }

      async function startVideo() {
        if (videoStarting) return;
        videoStarting = true;
        try {
          if (!playerCfg) playerCfg = await loadConfig();
          const streamName = streamOverride || playerCfg.streamName || "mystream";
          const mtxHttpPort = playerCfg.mtxHttpPort || 8889;
          const playerUrl = `http://${host}:${mtxHttpPort}/${streamName}?controls=0&muted=1`;
          document.getElementById("vurl").textContent = playerMode === "iframe" ? playerUrl : `/whep?stream=${streamName}`;

          if (playerMode === "iframe") {
            useIframe(playerUrl);
            return;
          }

          // On-demand: if the stream isn't ready yet, WHEP can fail; retry a few times before falling back.
          let lastErr = null;
          for (let i = 0; i < 12; i++) {
            try {
              await startWhep(streamName);
              return;
            } catch (e) {
              lastErr = e;
              await new Promise((r) => setTimeout(r, 800));
            }
          }
          // Fallback (keeps UX usable if WHEP fails in some browsers).
          console.warn("WHEP failed, fallback to iframe:", lastErr);
          useIframe(playerUrl);
        } finally {
          videoStarting = false;
        }
      }

      // If token gating is enabled, do not start video until control auth succeeds.
      // This avoids "no token, click CONNECT, host flashes" behavior in on-demand setups.
      loadConfig()
        .then((cfg) => {
          if (cfg && cfg.tokenRequired) return;
          startVideo().catch(() => null);
        })
        .catch(() => startVideo().catch(() => null));

      document.getElementById("wurl").textContent = ctrlWsUrl;

      const wsState = document.getElementById("wsState");
      const stage = document.getElementById("stage");
      const overlay = document.getElementById("overlay");
      const tokenEl = document.getElementById("token");
      const btnConn = document.getElementById("btnConn");
      const btnIdr = document.getElementById("btnIdr");

	      // Default hide hint; enable via ?hint=1.
	      stage.classList.toggle("hint-on", (new URLSearchParams(location.search).get("hint") || "0") === "1");

      let ws = null;
      let authed = false;
      // Mouse move send strategy:
      // - Coalesce pointer/mouse moves and send at most once per animation frame.
      // - If the websocket send buffer is backing up, drop intermediate moves.
      let pendingMove = null;
      let moveRaf = 0;
      const MAX_BUFFERED_BYTES = 64 * 1024;

      function setState(ok, text) {
        wsState.classList.toggle("ok", ok);
        wsState.classList.toggle("bad", !ok);
        wsState.textContent = text;
      }

      function send(obj) {
        // Do not send control events until authenticated.
        if (!authed) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        // If the TCP/WebSocket send buffer is backed up, avoid queueing more input.
        if (ws.bufferedAmount > MAX_BUFFERED_BYTES) return;
        ws.send(JSON.stringify(obj));
      }

      function queueMove(ev) {
        if (!authed) return;
        pendingMove = mapXY(ev);
        if (moveRaf) return;
        moveRaf = requestAnimationFrame(() => {
          moveRaf = 0;
          if (!pendingMove) return;
          const p = pendingMove;
          pendingMove = null;
          send({ t: "mouse", k: "move", ...p });
        });
      }

      function connect() {
        authed = false;
        const tok = (tokenEl.value || "").trim();
        const url = tok ? `${ctrlWsUrl}?token=${encodeURIComponent(tok)}` : ctrlWsUrl;
        ws = new WebSocket(url);

        ws.onopen = () => setState(false, "ctrl: connected (auth...)");
        ws.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch {
            return;
          }
          if (msg && msg.t === "auth") {
            if (msg.ok) {
              authed = true;
              try {
                localStorage.setItem("mlw_token", tok);
              } catch (_) {}
              setState(true, "ctrl: authed");
              // On-demand mode: start video only after control is authenticated.
              // (If video is already playing, this is harmless.)
              try {
                startVideo();
              } catch (_) {}
            } else {
              setState(false, `ctrl: auth failed (${msg.error || "err"})`);
            }
          }
        };
        ws.onclose = () => {
          authed = false;
          setState(false, "ctrl: disconnected");
        };
        ws.onerror = () => {
          setState(false, "ctrl: error");
          try {
            ws.close();
          } catch (_) {}
        };
      }

      function loadSavedToken() {
        const fromUrl = (new URLSearchParams(location.search).get("token") || "").trim();
        if (fromUrl) return fromUrl;
        try {
          return (localStorage.getItem("mlw_token") || "").trim();
        } catch (_) {
          return "";
        }
      }
      tokenEl.value = loadSavedToken();
      btnConn.addEventListener("click", () => connect());

      function overlayRect() {
        return overlay.getBoundingClientRect();
      }

      function mapXY(ev) {
        const r = overlayRect();
        const x = Math.max(0, Math.min(r.width - 1, ev.clientX - r.left));
        const y = Math.max(0, Math.min(r.height - 1, ev.clientY - r.top));
        // Reference size (pixels) for ABS.
        // For MVP, use overlay rect size. Server may optionally remap to host via CTRL_REF_W/H.
        return { x: Math.round(x), y: Math.round(y), ref_w: Math.round(r.width), ref_h: Math.round(r.height) };
      }

      // Prefer pointer events (better on touchpads, supports capture), fallback to mousemove.
      overlay.addEventListener("pointermove", queueMove);
      overlay.addEventListener("mousemove", queueMove);

      function btnName(ev) {
        if (ev.button === 2) return "right";
        if (ev.button === 1) return "middle";
        return "left";
      }

      overlay.addEventListener("mousedown", (ev) => {
        ev.preventDefault();
        overlay.focus();
        const p = mapXY(ev);
        pendingMove = null;
        send({ t: "mouse", k: "move", ...p });
        send({ t: "mouse", k: "down", b: btnName(ev) });
      });

      overlay.addEventListener("mouseup", (ev) => {
        ev.preventDefault();
        const p = mapXY(ev);
        send({ t: "mouse", k: "move", ...p });
        send({ t: "mouse", k: "up", b: btnName(ev) });
      });

      overlay.addEventListener("wheel", (ev) => {
        ev.preventDefault();
        send({ t: "mouse", k: "wheel", dx: ev.deltaX, dy: ev.deltaY });
      }, { passive: false });

      overlay.addEventListener("contextmenu", (ev) => ev.preventDefault());

      overlay.addEventListener("keydown", (ev) => {
        // We only send key press (down+up) semantics on server side.
        // Don't fight refresh shortcuts.
        if (ev.key === "F5" || ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "r")) return;
        ev.preventDefault();
        const MOD_SHIFT = 0x01;
        const MOD_CTRL = 0x02;
        const MOD_ALT = 0x04;
        const MOD_META = 0x08;
        const modifiers =
          (ev.shiftKey ? MOD_SHIFT : 0) |
          (ev.ctrlKey ? MOD_CTRL : 0) |
          (ev.altKey ? MOD_ALT : 0) |
          (ev.metaKey ? MOD_META : 0);
        send({ t: "key", k: "press", key: ev.key, modifiers });
      });

      btnIdr.addEventListener("click", () => send({ t: "req_idr" }));
    </script>
  </body>
</html>
