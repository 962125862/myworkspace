# ml_worker 配置文件 - 推流到远程服务器示例
# 位置: deploy/workers/worker00.conf

# Sunshine 主机配置
HOST="192.168.11.50"
APP="Desktop"
IMAGE="ml-worker:latest"
WORKER_BIN=""

# TCP推流配置
# TCP_HOST: 推流目标地址（可以是本地或远程服务器）
# TCP_PORT: 推流目标端口
# STREAM_ID: 流标识符（1-65535）

# 示例1: 推流到本地（默认）
# TCP_HOST="127.0.0.1"
# TCP_PORT="9000"

# 示例2: 推流到局域网其他机器
# TCP_HOST="192.168.1.100"
# TCP_PORT="9000"

# 示例3: 推流到公网服务器
# TCP_HOST="your-server.com"
# TCP_PORT="9000"

# 当前配置: 推流到 192.168.11.31
TCP_HOST="192.168.11.31"
TCP_PORT="19000"
STREAM_ID="1"

# 控制端口配置
CONTROL_PORT="50001"

# 视频参数
WIDTH="1280"
HEIGHT="720"
FPS="60"
BITRATE="10000"
PACKET_SIZE="1024"
COLORSPACE="709"
RANGE="limited"
