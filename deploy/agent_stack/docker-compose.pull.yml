services:
  strem_agent_server:
    image: ${AGENT_STACK_REGISTRY:-ghcr.io/962125862/myworkspace/strem-agent-server}:${AGENT_STACK_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    environment:
      STREM_AGENT_SERVER_ENV_FILE: /config/strem_agent_server.env
    volumes:
      - ./config/strem_agent_server.env:/config/strem_agent_server.env:ro

  agent_link_service:
    image: ${AGENT_STACK_REGISTRY_AGENT_LINK:-ghcr.io/962125862/myworkspace/agent-link-service}:${AGENT_STACK_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    env_file:
      - ./config/agent_link_service.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/repo
